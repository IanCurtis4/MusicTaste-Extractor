[project]
name = "music-taste-extractor"
version = "0.1.0"
description = "Local pipeline for extracting and analysing music taste from Google Takeout YouTube history."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "jinja2>=3.1",
  "lxml>=5.3",
  "plotly>=6.0",
  "typer>=0.15",
]

[project.scripts]
music-taste = "music_taste.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_taste"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

